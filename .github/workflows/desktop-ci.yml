# CI for the V2 desktop generation (finrobot_desktop/).
#
# Lives at the repo root because GitHub only reads .github/workflows/ there,
# but every step is scoped to finrobot_desktop/ so V0 and V1 are untouched.
name: Desktop CI

on:
  push:
    branches: [master]
    paths: ['finrobot_desktop/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    branches: [master]
    paths: ['finrobot_desktop/**', '.github/workflows/desktop-ci.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finrobot_desktop
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Action majors track the runner's Node runtime, not our code: GitHub now
      # executes JavaScript actions on Node 24, and the v4/v5 bundles carried an
      # old node-fetch@2 -> whatwg-url@5 -> tr46@0.0.3 chain that does
      # require("punycode"), which Node >= 21 reports as
      # "[DEP0040] DeprecationWarning: The `punycode` module is deprecated" in
      # the checkout/setup step logs. The v5/v6 releases were rebuilt for the
      # Node 24 runtime with refreshed dependencies. finrobot's own Node tree
      # was audited separately (uri-js's unused ESM build is the only
      # punycode reference) and never emits it.
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check finrobot/

      # Was `pre-commit run ruff-format --all-files`, which resolves files from
      # the git root — now the whole monorepo, including never-formatted V0/V1
      # code. Scope it to this project's directory instead.
      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy finrobot/ --strict

      - name: Unit tests
        run: uv run pytest tests/unit/ -v
        env:
          FINROBOT_MODEL_NAME: "test"
          FINROBOT_DEEPSEEK_API_KEY: "test-key"

  # Known-vulnerability gate for the exact dependency set that ships: every
  # package pinned in uv.lock (incl. the AI stack — pydantic-ai-slim, openai,
  # anthropic, httpx2 …) and the UI's production npm tree (ai / @ai-sdk/react …).
  # Fails the build on any advisory, so a dependency bump or a newly published
  # CVE against a pinned version is caught before release, not after.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install uv
        run: pip install uv
      - name: Audit Python dependencies (uv.lock)
        working-directory: finrobot_desktop
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --progress-spinner off
      - name: Audit npm dependencies (production tree)
        working-directory: finrobot_desktop/desktop
        run: npm audit --omit=dev --audit-level=moderate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finrobot_desktop/desktop
    strategy:
      matrix:
        # Lower bound: @lingui/cli imports fs.globSync, added in Node 22, so
        # `lingui compile` — the prelude to test, build and dev — cannot even
        # parse on Node 20 (vitest 5 additionally needs >= 22.12). Node 26 is
        # covered since vitest 5 (which no longer lets Node's own lazy
        # globalThis.localStorage shadow the jsdom one) and tailwindcss 4.3 /
        # playwright 1.64 (module.registerHooks instead of the deprecated
        # module.register, DEP0205). Keep this matrix in sync with the
        # `engines` field in desktop/package.json.
        node-version: ['22', '24', '26']
    steps:
      # See the backend job for why these track the v5 action generation.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
